<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>知识库动态看板</title>
<style>
:root { --bg:#fff; --fg:#000; --mid:#444; --light:#6a6a6a; --border:#9a9a9a; --soft:#e5e5e5; --card:#f7f7f7; }
* { box-sizing:border-box; margin:0; padding:0; }
html, body { width:100%; height:100%; background:var(--bg); color:var(--fg); }
body {
  width:100vw; height:100vh; overflow:hidden; padding:30px 38px 20px;
  font-family:Georgia,'Noto Serif SC','Songti SC','SimSun',serif;
  display:flex; flex-direction:column;
}
.sans { font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif; }
.mono { font-family:'Courier New',monospace; font-variant-numeric:tabular-nums; }

/* ===== Header (landscape) ===== */
.header {
  display:grid; grid-template-columns:minmax(0,1fr) auto; gap:26px;
  align-items:end; padding-bottom:14px; border-bottom:4px solid var(--fg);
}
.clock { font-size:62px; font-weight:700; line-height:.9; letter-spacing:-3px; }
.date-row { display:flex; gap:16px; margin-top:11px; font-size:21px; color:var(--mid); }
.battery { margin-top:8px; font-size:18px; color:var(--mid); }
.brand { text-align:right; }
.brand h1 { font-size:38px; line-height:1.05; letter-spacing:.04em; }
.brand p { margin-top:8px; font-size:17px; color:var(--mid); letter-spacing:.18em; }
.ai-strip {
  margin-top:14px; border:2px solid var(--fg); padding:9px 16px;
  display:flex; gap:18px; align-items:center; font-size:18px;
}
.ai-label { font-weight:700; white-space:nowrap; }
.ai-value { overflow:hidden; white-space:nowrap; text-overflow:ellipsis; color:var(--mid); }
.data-alert { display:none; margin-top:10px; padding:7px 12px; border:3px solid var(--fg); text-align:center; font:700 16px/1.3 Arial,sans-serif; }
.data-alert.on { display:block; }

/* ===== Landscape main: three columns ===== */
.dashboard {
  margin-top:16px; display:grid; gap:18px; flex:1; min-height:0;
  grid-template-columns:1.24fr 1fr 1fr;
}
.panel { border:2px solid var(--border); background:var(--card); padding:18px 20px; overflow:hidden; display:flex; flex-direction:column; min-height:0; }
.panel-head { display:flex; justify-content:space-between; align-items:baseline; border-bottom:2px solid var(--fg); padding-bottom:9px; margin-bottom:14px; flex-shrink:0; }
.panel-title { font-size:26px; font-weight:700; }
.panel-meta { font-size:17px; color:var(--light); }

/* Topics */
.topic-list { display:flex; flex-direction:column; justify-content:space-between; flex:1; min-height:0; gap:10px; }
.topic-row { display:grid; grid-template-columns:minmax(0,1fr) 96px; gap:14px; align-items:end; }
.topic-name { font:600 21px/1.2 Arial,'PingFang SC',sans-serif; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
.topic-count { font-size:23px; font-weight:700; text-align:right; }
.topic-bar { grid-column:1 / span 2; height:9px; background:#ddd; border:1px solid #bbb; }
.topic-fill { height:100%; background:#202020; min-width:2px; }

/* Today */
.today-list { display:flex; flex-direction:column; flex:1; min-height:0; }
.today-item { padding:11px 0 12px; border-bottom:1px solid #aaa; }
.today-item:last-child { border-bottom:0; }
.today-account { font:700 14px/1.2 Arial,sans-serif; color:var(--light); letter-spacing:.06em; margin-bottom:4px; }
.today-title { font-size:19px; line-height:1.35; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.empty { padding:40px 10px; text-align:center; color:var(--light); font-size:21px; }

/* Trends */
.metric-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.metric { background:#fff; border:1px solid #aaa; padding:11px 13px; }
.metric-label { font:16px/1.3 Arial,sans-serif; color:var(--light); }
.metric-value { margin-top:3px; font-size:33px; font-weight:700; }
.metric-sub { font:13px/1.3 Arial,sans-serif; color:var(--light); margin-top:2px; }
.chart-title { margin-top:13px; font:700 16px/1.2 Arial,sans-serif; }
.spark { flex:0 0 190px; height:190px; display:flex; align-items:flex-end; gap:10px; margin-top:9px; border-bottom:2px solid #555; padding:0 6px; }
.spark-col { flex:1; height:100%; display:flex; flex-direction:column; justify-content:flex-end; align-items:center; }
.spark-bar { width:66%; min-height:2px; background:#222; }
.spark-day { height:20px; margin-top:5px; font:12px/1 Arial,sans-serif; color:var(--light); }
.legend { display:flex; gap:16px; margin-top:auto; padding-top:9px; font:13px/1 Arial,sans-serif; color:var(--light); flex-shrink:0; }

.footer { margin-top:14px; border-top:2px solid var(--fg); padding-top:9px; display:flex; justify-content:space-between; font:16px/1.2 Arial,sans-serif; color:var(--mid); flex-shrink:0; }
.footer .warn { font-weight:700; color:#000; }

/* ===== Portrait fallback: two columns, taller cells ===== */
@media (max-aspect-ratio: 1/1) {
  body { padding:34px 38px 26px; }
  .header { grid-template-columns:360px minmax(0,1fr); gap:22px; padding-bottom:20px; }
  .clock { font-size:76px; letter-spacing:-4px; }
  .date-row { margin-top:14px; font-size:23px; }
  .battery { margin-top:10px; font-size:19px; }
  .brand h1 { font-size:40px; }
  .brand p { margin-top:10px; font-size:19px; }
  .ai-strip { margin-top:17px; padding:12px 16px; font-size:20px; }
  .dashboard { grid-template-columns:1.06fr .94fr; grid-template-rows:minmax(0,1.3fr) minmax(0,1fr); gap:20px; }
  .topics { grid-row:1 / span 2; }
  .panel { padding:22px 24px; }
  .panel-title { font-size:28px; }
  .panel-meta { font-size:18px; }
  .topic-list { gap:18px; }
  .topic-row { grid-template-columns:minmax(0,1fr) 104px; gap:16px; }
  .topic-name { font-size:22px; }
  .topic-count { font-size:24px; }
  .topic-bar { height:12px; }
  .today-item { padding:13px 0 14px; }
  .today-account { font-size:15px; }
  .today-title { font-size:21px; }
  .metric-value { font-size:36px; }
  .spark { min-height:110px; gap:12px; }
  .footer { margin-top:20px; padding-top:12px; font-size:17px; }
}

/* ===== Small screens / desktop preview ===== */
@media (max-width:820px) {
  body { padding:14px 16px 10px; }
  .header { grid-template-columns:minmax(0,1fr) auto; gap:10px; padding-bottom:7px; border-width:2px; }
  .clock { font-size:30px; letter-spacing:-1px; }
  .date-row { margin-top:5px; gap:7px; font-size:11px; }
  .battery { margin-top:4px; font-size:10px; }
  .brand h1 { font-size:18px; }
  .brand p { margin-top:4px; font-size:9px; }
  .ai-strip { margin-top:6px; padding:4px 7px; font-size:10px; gap:7px; border-width:1px; }
  .data-alert { margin-top:5px; padding:4px 6px; font-size:10px; border-width:2px; }
  .dashboard { margin-top:7px; gap:7px; grid-template-columns:1fr 1fr; grid-template-rows:minmax(0,1.35fr) minmax(0,1fr); }
  .topics { grid-row:1 / span 2; }
  .panel { padding:7px 8px; border-width:1px; }
  .panel-head { padding-bottom:4px; margin-bottom:6px; border-width:1px; }
  .panel-title { font-size:12px; }
  .panel-meta { font-size:9px; }
  .topic-list { gap:5px; }
  .topic-row { grid-template-columns:minmax(0,1fr) 42px; gap:5px; }
  .topic-name { font-size:9px; }
  .topic-count { font-size:10px; }
  .topic-bar { height:4px; }
  .today-item { padding:5px 0; }
  .today-account { font-size:6px; margin-bottom:1px; }
  .today-title { font-size:9px; line-height:1.2; }
  .empty { padding:14px 4px; font-size:10px; }
  .metric-grid { gap:4px; }
  .metric { padding:4px 5px; }
  .metric-label { font-size:7px; }
  .metric-value { font-size:15px; margin-top:1px; }
  .metric-sub { font-size:6px; }
  .chart-title { margin-top:4px; font-size:7px; }
  .spark { min-height:32px; gap:3px; margin-top:3px; padding:0 2px; border-width:1px; }
  .spark-day { height:8px; margin-top:1px; font-size:6px; }
  .legend { margin-top:2px; gap:6px; font-size:6px; }
  .footer { margin-top:5px; padding-top:3px; border-width:1px; font-size:7px; }
}
</style>
</head>
<body>
<header>
  <div class="header">
    <div>
      <div class="clock mono" id="dtTime">--:--</div>
      <div class="date-row sans"><span id="dtDate">----年--月--日</span><span id="dtWeek">---</span></div>
      <div class="battery sans">Kindle 电量 <span id="batPct">--%</span></div>
    </div>
    <div class="brand">
      <h1>知识库动态看板</h1>
      <p class="sans">LANTEL KNOWLEDGE PULSE</p>
    </div>
  </div>
  <div class="ai-strip sans"><span class="ai-label">AI 额度</span><span class="ai-value" id="aiSummary">等待实时额度数据</span></div>
  <div class="data-alert" id="dataAlert"></div>
</header>

<main class="dashboard">
  <section class="panel topics">
    <div class="panel-head"><h2 class="panel-title">采集主题</h2><span class="panel-meta sans" id="topicTotal">0 个文件</span></div>
    <div class="topic-list" id="topicList"><div class="empty">等待知识库统计</div></div>
  </section>

  <section class="panel today">
    <div class="panel-head"><h2 class="panel-title">今日抓取</h2><span class="panel-meta sans" id="todayTotal">0 篇</span></div>
    <div class="today-list" id="todayList"><div class="empty">今日暂无新增</div></div>
  </section>

  <section class="panel trends">
    <div class="panel-head"><h2 class="panel-title">知识库趋势</h2><span class="panel-meta sans">近 7 日</span></div>
    <div class="metric-grid">
      <div class="metric"><div class="metric-label">新增来源</div><div class="metric-value mono" id="metricSources">0</div><div class="metric-sub">近 7 日采集成功</div></div>
      <div class="metric"><div class="metric-label">新增原子卡</div><div class="metric-value mono" id="metricAtomic">0</div><div class="metric-sub">近 7 日新建</div></div>
      <div class="metric"><div class="metric-label">待审核卡片</div><div class="metric-value mono" id="metricPending">0</div><div class="metric-sub">draft 队列</div></div>
      <div class="metric"><div class="metric-label">已发布 / 同步</div><div class="metric-value mono" id="metricPublished">0 / 0</div><div class="metric-sub">WeKnora 输入 / 已登记</div></div>
    </div>
    <div class="chart-title">每日新增来源</div>
    <div class="spark" id="trendChart"></div>
    <div class="legend"><span>■ 来源</span><span>数据为空时保持零基线</span></div>
  </section>
</main>

<footer class="footer sans"><span>本机只读采集 · 公开页仅含聚合数据</span><span id="dataStatus">等待实时数据</span></footer>

<script src="data.js"></script>
<script src="live-endpoint.js"></script>
<script src="dashboard-runtime.js?v=20261101"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>知识库动态看板</title>
<style>
:root { --bg:#fff; --fg:#000; --mid:#444; --light:#6a6a6a; --border:#9a9a9a; --soft:#e5e5e5; --card:#f7f7f7; }
* { box-sizing:border-box; margin:0; padding:0; }
html, body { width:100%; min-height:100%; background:var(--bg); color:var(--fg); }
body { width:1264px; height:1680px; overflow:hidden; padding:44px 48px 34px; font-family:Georgia,'Noto Serif SC','Songti SC','SimSun',serif; display:flex; flex-direction:column; }
.sans { font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif; }
.mono { font-family:'Courier New',monospace; font-variant-numeric:tabular-nums; }
.header { display:grid; grid-template-columns:360px 1fr; gap:24px; padding-bottom:24px; border-bottom:4px solid var(--fg); }
.clock { font-size:82px; font-weight:700; line-height:.9; letter-spacing:-4px; }
.date-row { display:flex; gap:18px; margin-top:17px; font-size:24px; color:var(--mid); }
.battery { margin-top:12px; font-size:20px; color:var(--mid); }
.brand { text-align:right; align-self:end; }
.brand h1 { font-size:44px; line-height:1.05; letter-spacing:.04em; }
.brand p { margin-top:12px; font-size:22px; color:var(--mid); letter-spacing:.18em; }
.ai-strip { margin-top:20px; border:2px solid var(--fg); padding:14px 18px; display:flex; gap:20px; align-items:center; font-size:21px; }
.ai-label { font-weight:700; white-space:nowrap; }
.ai-value { overflow:hidden; white-space:nowrap; text-overflow:ellipsis; color:var(--mid); }
.data-alert { display:none; margin-top:14px; padding:10px 14px; border:3px solid var(--fg); text-align:center; font:700 18px/1.3 Arial,sans-serif; }
.data-alert.on { display:block; }
.dashboard { margin-top:24px; display:grid; grid-template-columns:1.08fr .92fr; grid-template-rows:710px 545px; gap:22px; flex:1; min-height:0; }
.panel { border:2px solid var(--border); background:var(--card); padding:24px 26px; overflow:hidden; }
.panel-head { display:flex; justify-content:space-between; align-items:baseline; border-bottom:2px solid var(--fg); padding-bottom:12px; margin-bottom:18px; }
.panel-title { font-size:30px; font-weight:700; }
.panel-meta { font-size:19px; color:var(--light); }
.topics { grid-row:1 / span 2; }
.topic-list { display:flex; flex-direction:column; gap:22px; }
.topic-row { display:grid; grid-template-columns:minmax(0,1fr) 112px; gap:18px; align-items:end; }
.topic-name { font:600 23px/1.25 Arial,'PingFang SC',sans-serif; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
.topic-count { font-size:26px; font-weight:700; text-align:right; }
.topic-bar { grid-column:1 / span 2; height:14px; background:#ddd; border:1px solid #bbb; }
.topic-fill { height:100%; background:#202020; min-width:2px; }
.today-list { list-style:none; }
.today-item { padding:14px 0 15px; border-bottom:1px solid #aaa; }
.today-item:last-child { border-bottom:0; }
.today-account { font:700 16px/1.2 Arial,sans-serif; color:var(--light); letter-spacing:.06em; margin-bottom:5px; }
.today-title { font-size:22px; line-height:1.4; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.empty { padding:50px 10px; text-align:center; color:var(--light); font-size:24px; }
.metric-grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
.metric { background:#fff; border:1px solid #aaa; padding:15px 17px; }
.metric-label { font:18px/1.3 Arial,sans-serif; color:var(--light); }
.metric-value { margin-top:5px; font-size:40px; font-weight:700; }
.metric-sub { font:15px/1.3 Arial,sans-serif; color:var(--light); margin-top:3px; }
.chart-title { margin-top:18px; font:700 18px/1.2 Arial,sans-serif; }
.spark { height:125px; display:flex; align-items:flex-end; gap:13px; margin-top:12px; border-bottom:2px solid #555; padding:0 7px; }
.spark-col { flex:1; height:100%; display:flex; flex-direction:column; justify-content:flex-end; align-items:center; }
.spark-bar { width:70%; min-height:2px; background:#222; }
.spark-day { height:24px; margin-top:6px; font:14px/1 Arial,sans-serif; color:var(--light); }
.legend { display:flex; gap:20px; margin-top:10px; font:15px/1 Arial,sans-serif; color:var(--light); }
.footer { margin-top:24px; border-top:2px solid var(--fg); padding-top:13px; display:flex; justify-content:space-between; font:18px/1.2 Arial,sans-serif; color:var(--mid); }
.footer .warn { font-weight:700; color:#000; }
@media (max-width:800px) {
  body { width:600px; height:800px; padding:18px 20px 14px; }
  .header { grid-template-columns:180px 1fr; gap:12px; padding-bottom:10px; border-width:2px; }
  .clock { font-size:40px; letter-spacing:-2px; }
  .date-row { margin-top:8px; gap:8px; font-size:12px; }
  .battery { margin-top:5px; font-size:11px; }
  .brand h1 { font-size:23px; }
  .brand p { margin-top:6px; font-size:11px; }
  .ai-strip { margin-top:9px; padding:6px 8px; font-size:11px; gap:8px; border-width:1px; }
  .dashboard { margin-top:10px; grid-template-rows:338px 260px; gap:10px; }
  .panel { padding:10px 12px; border-width:1px; }
  .panel-head { padding-bottom:5px; margin-bottom:8px; border-width:1px; }
  .panel-title { font-size:15px; }
  .panel-meta { font-size:10px; }
  .topic-list { gap:9px; }
  .topic-row { grid-template-columns:minmax(0,1fr) 52px; gap:8px; }
  .topic-name { font-size:11px; }
  .topic-count { font-size:13px; }
  .topic-bar { height:6px; }
  .today-item { padding:6px 0; }
  .today-account { font-size:8px; margin-bottom:2px; }
  .today-title { font-size:11px; line-height:1.25; }
  .metric-grid { gap:6px; }
  .metric { padding:7px 8px; }
  .metric-label { font-size:9px; }
  .metric-value { font-size:20px; margin-top:2px; }
  .metric-sub { font-size:8px; }
  .chart-title { margin-top:8px; font-size:9px; }
  .spark { height:58px; gap:5px; margin-top:4px; padding:0 3px; border-width:1px; }
  .spark-day { height:10px; margin-top:2px; font-size:7px; }
  .legend { margin-top:4px; gap:8px; font-size:8px; }
  .footer { margin-top:9px; padding-top:5px; border-width:1px; font-size:9px; }
}
</style>
</head>
<body>
<header>
  <div class="header">
    <div>
      <div class="clock mono" id="dtTime">--:--</div>
      <div class="date-row sans"><span id="dtDate">----年--月--日</span><span id="dtWeek">---</span></div>
      <div class="battery sans">Kindle 电量 <span id="batPct">--%</span></div>
    </div>
    <div class="brand">
      <h1>知识库动态看板</h1>
      <p class="sans">LANTEL KNOWLEDGE PULSE</p>
    </div>
  </div>
  <div class="ai-strip sans"><span class="ai-label">AI 额度</span><span class="ai-value" id="aiSummary">等待实时额度数据</span></div>
  <div class="data-alert" id="dataAlert"></div>
</header>

<main class="dashboard">
  <section class="panel topics">
    <div class="panel-head"><h2 class="panel-title">采集主题</h2><span class="panel-meta sans" id="topicTotal">0 个文件</span></div>
    <div class="topic-list" id="topicList"><div class="empty">等待知识库统计</div></div>
  </section>

  <section class="panel today">
    <div class="panel-head"><h2 class="panel-title">今日抓取</h2><span class="panel-meta sans" id="todayTotal">0 篇</span></div>
    <div id="todayList"><div class="empty">今日暂无新增</div></div>
  </section>

  <section class="panel trends">
    <div class="panel-head"><h2 class="panel-title">知识库趋势</h2><span class="panel-meta sans">近 7 日</span></div>
    <div class="metric-grid">
      <div class="metric"><div class="metric-label">新增来源</div><div class="metric-value mono" id="metricSources">0</div><div class="metric-sub">近 7 日采集成功</div></div>
      <div class="metric"><div class="metric-label">新增原子卡</div><div class="metric-value mono" id="metricAtomic">0</div><div class="metric-sub">近 7 日新建</div></div>
      <div class="metric"><div class="metric-label">待审核卡片</div><div class="metric-value mono" id="metricPending">0</div><div class="metric-sub">draft 队列</div></div>
      <div class="metric"><div class="metric-label">已发布 / 同步</div><div class="metric-value mono" id="metricPublished">0 / 0</div><div class="metric-sub">WeKnora 输入 / 已登记</div></div>
    </div>
    <div class="chart-title">每日新增来源</div>
    <div class="spark" id="trendChart"></div>
    <div class="legend"><span>■ 来源</span><span>数据为空时保持零基线</span></div>
  </section>
</main>

<footer class="footer sans"><span>本机只读采集 · 公开页仅含聚合数据</span><span id="dataStatus">等待实时数据</span></footer>

<script src="data.js"></script>
<script src="live-endpoint.js"></script>
<script src="dashboard-runtime.js?v=20261006"></script>
</body>
</html>
